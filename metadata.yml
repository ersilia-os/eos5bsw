Identifier: eos5bsw
Slug: ecoli-retention
Status: Ready
Title: Small molecule retention by Gram-negative bacteria based on a large-scale
  LC/MS screen
Description: Predicts whether a small molecule accumulates inside Escherichia coli,
  the barrier that decides if an otherwise potent compound ever reaches its target
  in a Gram-negative cell. Le Goff and colleagues at Idorsia screened 13,056 compounds
  by LC/MS against a wild-type strain and an efflux-deficient TolC mutant and labelled
  6,416 of them retention-positive or negative; 60 per cent of the positives in the
  mutant were lost from the wild type, showing how much efflux costs. Ersilia trained
  this classifier on that published data with its LazyQSAR tool.
