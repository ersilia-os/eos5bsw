Identifier: eos5bsw
Slug: ecoli-retention
Status: Ready
Title: Small molecule retention by Gram-negative bacteria based on a large-scale
  LC/MS screen
Description: Predicts whether a small molecule accumulates inside Escherichia 
  coli, the barrier that decides if a potent compound ever reaches its target in
  a Gram-negative cell. Le Goff and colleagues at Idorsia screened 13,056 
  compounds by mass spectrometry against a wild-type strain and an 
  efflux-deficient TolC mutant and labelled 6,416 of them retention-positive or 
  negative. Ersilia trained a LazyQSAR classifier on 6,407 of these, 2,879 
  retained, with a five-fold out-of-fold AUROC of 0.89. Retention in E. coli 
  does not by itself confer antibacterial activity.
