Interpretation: Rank score of retention inside Escherichia coli combining uptake
  with escape from efflux, calibrated against the Ersilia reference library of 
  50K compounds. A score above 0.65 beats 99% of that library. Trained on 2879 
  retained compounds against 3528 non-retained.
