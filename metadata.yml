Identifier: eos5bsw
Slug: ecoli-retention
Status: Ready
Title: Small molecule retention by Gram-negative bacteria based on a large-scale
  LC/MS screen
Description: Estimates how much compound is retained inside Gram-negative bacteria,
  the property that decides whether an otherwise potent molecule ever reaches its
  target. Le Goff and colleagues built a high-throughput LC/MS assay to measure intracellular
  levels directly, generating retention data on a scale that earlier one-compound-at-a-time
  methods could not reach, and used it to train predictors. Retention combines uptake
  with efflux, so a high score indicates the compound stays inside rather than that
  it simply enters.
